windows:
  sizes_s: [1, 10, 60]  #dlugosci okien
  lateness_s: 1         #ile czekamy na spoznione flowy
  dedup_ttl_s: 60       #jak dlugo pamietamy flow_id do odrzucania dupliaktow

detection:
  rules:
    port_scan:
      unique_dst_ports: {1: 35, 10: 80, 60: 150}
    dos_like:
      connections: {1: 400, 10: 1500}
    brute_force:
      attempts: {10: 15, 60: 30}
      ports: [21, 22, 23, 3389]
    #TODO: powinno byc odchylenie od baselinu
    abnormal:
      unique_dst_addrs: {10: 60, 60: 150}
  ml:
    windows: [1, 10]
    z_score_threshold: 7.5
    alpha: 0.05
    min_samples: 30
    min_sigma: 3.0
    ttl_s: 300

alerts:
  cooldown_s: 180
  severity:
    medium: 2.0
    high: 5.0
    critical: 10.0