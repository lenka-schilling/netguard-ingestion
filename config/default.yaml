windows:
  sizes_s: [1, 10, 60]  #dlugosci okien
  lateness_s: 1         #ile czekamy na spoznione flowy
  dedup_ttl_s: 60       #jak dlugo pamietamy flow_id do odrzucania dupliaktow

detection:
  rules:
    port_scan:
      unique_dst_ports: {1: 35, 10: 80, 60: 150}
      min_ports_per_host: 2.5
      ignore_broadcast: true
    dos_like:
      connections: {1: 400, 10: 1500}
      packets_per_s: {1: 2500000, 10: 500000}
    brute_force:
      attempts: {10: 15, 60: 30}
      ports: [21, 22, 23, 3389]
    abnormal:
      windows: [10, 60]
      multiplier: 3.0
      baseline:                    #profil zrodla; wyliczono z: normal_1h.pcap
        connections:      {10: 233.941, 60: 523.254}
        unique_dst_addrs: {10: 85.1, 60: 168.081}
        new_conn_rate:    {10: 23.394, 60: 8.721}
        packets_per_s:    {10: 1555.51, 60: 1091.82}
        bytes_per_s:      {10: 83993.3, 60: 58889.9}
      min_values:
        connections: 20
        unique_dst_addrs: 10
        new_conn_rate: 2.0
        packets_per_s: 150000
        bytes_per_s: 10500000
      groups:                   #hosty o innej normie (wyliczone przez scripts.build_baseline)
        high_volume_x24:
          hosts: ["147.32.84.118", "147.32.84.229"]
          enabled: true
          multiplier: 24
        high_volume_x12:
          hosts: ["147.32.84.59"]
          enabled: true
          multiplier: 12
        high_volume_x48:
          hosts: ["147.32.86.194"]
          enabled: true
          multiplier: 48
  ml:
    windows: [10]
    z_score_threshold: 15.0
    alpha: 0.05
    min_samples: 30
    min_sigma: 5.0
    ttl_s: 300

alerts:
  cooldown_s: 180
  severity:
    medium: 2.0
    high: 5.0
    critical: 10.0
